      fill="none"
      stroke="url(#aqua)"
      stroke-width="4.3"
      stroke-linecap="round"
    />
    <path d="M54 31v13l12-6.5z" fill="#ffffff" stroke="#0b4350" stroke-width="1.4" />
    <path
      d="M118 24h29M116 34h31M114 44h33"
      fill="none"
      stroke="#ffffff"
      stroke-width="7"
      stroke-linecap="round"
    />
    <path
      d="M118 24h29M116 34h31M114 44h33"
      fill="none"
      stroke="url(#aqua)"
      stroke-width="4.4"
      stroke-linecap="round"
    />
