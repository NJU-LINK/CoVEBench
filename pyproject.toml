[project]
name = "covebench-eval"
version = "0.1.0"
description = "Reproducible objective video-editing evaluation tools for CoVEBench."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=0.33.0",
    "decord>=0.6.0",
    "einops>=0.8.0",
    "huggingface-hub[cli]>=0.24.0",
    "numpy>=1.24,<2.0",
    "opencv-python-headless>=4.9.0",
    "openai>=1.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "qwen-vl-utils>=0.0.8",
    "scikit-image>=0.22.0",
    "scipy>=1.10.0",
    "timm>=0.9.12",
    "tqdm>=4.66.0",
    "transformers>=4.51.0",
]

[project.optional-dependencies]
cuda = [
    "sam2>=1.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
]
dev = [
    "ruff>=0.6.0",
]

[project.scripts]
covebench-run = "covebench_eval.run_model:main"
covebench-download = "covebench_eval.download_assets:main"
covebench-download-data = "covebench_eval.download_dataset:main"

[tool.uv]
package = true

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
